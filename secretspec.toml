[project]
name = "python-discord-bot"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
DISCORD_BOT_TOKEN = { description = "DISCORD_BOT_TOKEN secret", required = true }
LAVALINK_HOST = { description = "LAVALINK_HOST secret", required = true }
LAVALINK_PASS = { description = "LAVALINK_PASS secret", required = true }
LAVALINK_PORT = { description = "LAVALINK_PORT secret", required = true }
PUBLIC_IP = { description = "PUBLIC_IP secret", required = true }
SONG_PATH = { description = "SONG_PATH secret", required = true }
# DATABASE_URL = { description = "Database connection string", required = true }

